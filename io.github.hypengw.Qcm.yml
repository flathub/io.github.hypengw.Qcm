app-id: io.github.hypengw.Qcm
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.rust-stable
command: Qcm
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.Qcm

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/zsh
  - /share/bash-completion
modules:
  - shared-modules/lua5.4/lua-5.4.json

  - name: protobuf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -Dprotobuf_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        commit: 2c74169b34066ceb8ddb6b882fcb3fb32d737a55
        tag: v36.2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protocolbuffers/protobuf/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
    cleanup:
      - '*'

  - name: qt6-grpc
    buildsystem: cmake-ninja
    post-install:
      - ln -s /app/lib/*-linux-gnu/*.so* /app/lib/
    sources:
      - type: git
        url: https://github.com/qt/qtgrpc.git
        tag: v6.11.1
        commit: 246eb3e3f33bde5ae90bcc8fc1ee54b9381fc60a

  - name: spirv-tools
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: v2025.4
        commit: 7f2d9ee926f98fc77a3ed1e1e0f113b8c9c49458
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        tag: vulkan-sdk-1.4.335.0
        commit: b824a462d4256d720bebb40e78b9eb8f78bbb305
        dest: external/spirv-headers
    cleanup:
      - '*'

  - name: lito
    buildsystem: simple
    build-commands:
      - cp -a bin share /app/
    sources:
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.8.7/lito-v0.8.7-linux-x86_64.tar.gz
        sha256: 362fdf8212f2aa09f52761b921e9b40bfe740b309369f0cd4994b79761deb77c
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/litocpp/lito/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name | sub("^[vV]"; "")
          url-query: '"https://github.com/litocpp/lito/releases/download/v" + $version
            + "/lito-v" + $version + "-linux-x86_64.tar.gz"'
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.8.7/lito-v0.8.7-linux-aarch64.tar.gz
        sha256: 15c1e6d12fdd346634bd6a2020e1e152ede0e7ff58a60654353973bab0f8e43e
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/litocpp/lito/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name | sub("^[vV]"; "")
          url-query: '"https://github.com/litocpp/lito/releases/download/v" + $version
            + "/lito-v" + $version + "-linux-aarch64.tar.gz"'
    cleanup:
      - '*'

  - name: Qcm
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/rust-stable/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CARGO_HOME: /run/build/Qcm/cargo
    build-commands:
      - lito install -p qcm-app --profile relwithdebinfo --prefix /app --source-bundle
        .lito/source-bundle --offline --locked
    sources:
      - type: git
        url: https://github.com/hypengw/Qcm.git
        commit: c0e796d9a4dbec3d154afcf3320ad63a632f26aa
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
        tag: v1.3.7
      - ./qcm-lito.json

  - name: Plugin
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin/plugins
      - cp -a qcm-ncm-plugin /app/bin/plugins/
    sources:
      - type: git
        url: https://github.com/hypengw/qcm-ncm-plugin.git
        commit: 39bd7442464d93ecfcb6cd4e8c2fd3eefea7a0ad
        tag: v0.1.1
        dest: qcm-ncm-plugin
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
